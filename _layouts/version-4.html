<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="theme-color" content="#f5f7fa">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iStockLens">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/version-4-social.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="iStockLens. Research the stock. Challenge the thesis.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="{{ '/assets/images/version-4-social.png' | absolute_url }}">
  <meta name="twitter:image:alt" content="iStockLens. Research the stock. Challenge the thesis.">
  <link rel="icon" href="{{ '/assets/images/version-4-favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/version-4.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/signup-flow.js' | relative_url }}" defer></script>
</head>
<body class="version-4">
  <a class="v4-skip" href="#main">Skip to content</a>
  {% include version-4/header.html %}
  <main id="main" tabindex="-1">{{ content }}</main>
  {% include version-4/footer.html %}
  {% include signup-dialog.html variant=4 %}
</body>
</html>
