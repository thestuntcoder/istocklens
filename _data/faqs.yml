- question: Is iStockLens financial advice?
  answer: "No. iStockLens is a research tool, not a financial adviser or brokerage. It does not execute trades. Use it to inform your thinking, verify what matters, and make your own investment decisions. Investing involves risk, including loss of capital."
- question: Is the Apple example live market data?
  answer: "No. Every example on this page is illustrative, not a live quote, current assessment or recommendation to buy or sell Apple. The interactive sample demonstrates how to separate business quality from valuation. Open the public Apple report to explore the product itself."
- question: What can I research with iStockLens?
  answer: "Company reports separate business quality and valuation, with Growth, Profitability, Cash/Financial Strength, Valuation and Stability scores. You can also explore price action, valuation zones, analyst consensus and targets, news price drivers and market themes. Watchlists and thesis journals help you keep track of your own thinking."
- question: What does the money-back guarantee cover?
  answer: "100% money back if customer does not use the app. The guarantee concerns non-use of the app subscription. It is not a guarantee of investment performance and does not protect against investment losses."
- question: How do I get started?
  answer: "Select “Get iStockLens” or “Start your research” to visit the download page. If you would like to explore first, use the illustrative sample here or follow the link to the public Apple report."
- question: Should I verify the ratings and summaries?
  answer: "Yes. Ratings are quantitative and summaries are automatically generated; neither replaces your judgment. Check company filings and other primary sources, challenge the assumptions behind a thesis, and consider information that a score may not capture."
